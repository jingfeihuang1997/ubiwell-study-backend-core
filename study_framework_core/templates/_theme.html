<style>
    /* Shared look for every internal web page. Included last in <head>, so it wins over the
       per-page styles for the parts every page has: page background, type, and the nav bar. */
    :root {
        --mg-bg: #f3f4f6;
        --mg-panel: #ffffff;
        --mg-line: #e5e7eb;
        --mg-ink: #111827;
        --mg-muted: #6b7280;
        --mg-accent: #2563eb;
        --mg-accent-soft: #eff6ff;
        --mg-nav-h: 60px;
        --mg-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    /* Keep room for the scrollbar on every page, so short and long pages line up and nothing shifts. */
    html { scrollbar-gutter: stable; overflow-y: scroll; }
    body {
        background: var(--mg-bg) !important;
        color: var(--mg-ink);
        font-family: var(--mg-font) !important;
        line-height: 1.5;
        min-height: 100vh;
    }

    /* Nav bar: same height, colors and spacing everywhere */
    nav.mg-nav.navbar {
        background: var(--mg-panel) !important;
        border-bottom: 1px solid var(--mg-line);
        box-shadow: none !important;
        min-height: var(--mg-nav-h);
        padding-top: 0; padding-bottom: 0;
        margin-bottom: 1.5rem !important;
    }
    nav.mg-nav .navbar-brand {
        color: var(--mg-ink) !important;
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: -0.01em;
        display: flex; align-items: center; gap: .5rem;
        padding: 0; margin-right: 1.5rem;
    }
    nav.mg-nav .navbar-brand i { color: var(--mg-accent); }
    nav.mg-nav .nav-link {
        color: var(--mg-muted) !important;
        font-weight: 500;
        font-size: .9rem;
        white-space: nowrap;
        padding: .45rem .75rem !important;
        border-radius: 8px;
    }
    nav.mg-nav .nav-link:hover { color: var(--mg-ink) !important; background: var(--mg-bg); }
    nav.mg-nav .nav-link.active { color: var(--mg-accent) !important; background: var(--mg-accent-soft); }
    nav.mg-nav .navbar-text { color: var(--mg-muted) !important; font-size: .875rem; white-space: nowrap; }
    nav.mg-nav .mg-logout {
        color: #374151; border: 1px solid var(--mg-line); background: var(--mg-panel);
        font-size: .85rem; white-space: nowrap;
    }
    nav.mg-nav .mg-logout:hover { background: var(--mg-bg); color: var(--mg-ink); }
    nav.mg-nav .navbar-toggler { border-color: var(--mg-line); }
    nav.mg-nav .navbar-toggler-icon {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%2855, 65, 81, 0.9%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }
    @media (max-width: 1199.98px) {
        nav.mg-nav .navbar-collapse { padding: .5rem 0 .75rem; }
        nav.mg-nav .navbar-nav.mg-account { flex-direction: row; align-items: center; gap: .75rem; margin-top: .5rem; }
    }

    /* Cards, buttons and tables: flat and the same on every page (some pages drew purple gradients) */
    .card { border: 1px solid var(--mg-line) !important; border-radius: 10px !important; box-shadow: none !important; }
    .card-header {
        background: var(--mg-panel) !important; color: var(--mg-ink) !important;
        border-bottom: 1px solid var(--mg-line) !important; font-weight: 600;
    }
    .card-header i { color: var(--mg-accent); }
    .btn-primary, .btn-success, .btn-info, .btn-warning, .btn-danger { background-image: none !important; box-shadow: none !important; }
    .btn-success { background-color: #059669 !important; border-color: #059669 !important; color: #fff !important; }
    .btn-info { background-color: var(--mg-panel) !important; border-color: var(--mg-line) !important; color: var(--mg-ink) !important; }
    .btn-warning { background-color: var(--mg-panel) !important; border-color: var(--mg-line) !important; color: var(--mg-ink) !important; }
    .table thead th {
        background: #f9fafb !important; background-image: none !important; color: var(--mg-muted) !important;
        font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .02em;
        border-bottom: 1px solid var(--mg-line) !important;
    }

    /* Page content shares one width and one heading style */
    .container.main-container { padding-top: 0 !important; padding-bottom: 2rem; }
    .btn-primary { background-color: var(--mg-accent) !important; border-color: var(--mg-accent) !important; color: #fff !important; }
    a { color: var(--mg-accent); }
</style>
