{# The one nav bar for every signed-in page. The active link is picked from the URL. #}
{% set p = request.path %}
<nav class="navbar navbar-expand-xl mg-nav">
    <div class="container">
        <a class="navbar-brand" href="/internal_web/">
            <i class="fas fa-shield-alt"></i>Mind Guard
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mgNav" aria-controls="mgNav" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mgNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if p.startswith('/internal_web/dashboard') or p.startswith('/internal_web/patient') %}active{% endif %}" href="/internal_web/dashboard">
                        <i class="fas fa-chart-line me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if p.startswith('/internal_web/user-management') %}active{% endif %}" href="/internal_web/user-management">
                        <i class="fas fa-users me-1"></i>User Management
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if p.startswith('/internal_web/ema-schedule') %}active{% endif %}" href="/internal_web/ema-schedule">
                        <i class="fas fa-calendar-alt me-1"></i>EMA Schedule
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if p.startswith('/internal_web/config-schedule') %}active{% endif %}" href="/internal_web/config-schedule">
                        <i class="fas fa-cogs me-1"></i>Config Management
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if p.startswith('/internal_web/download_compliance') %}active{% endif %}" href="/internal_web/download_compliance">
                        <i class="fas fa-download me-1"></i>Data Export
                    </a>
                </li>
            </ul>
            <div class="navbar-nav mg-account">
                <span class="navbar-text me-3"><i class="fas fa-user me-1"></i>{{ session.get('admin_username', 'Admin') }}</span>
                <a href="/internal_web/logout" class="btn btn-sm mg-logout"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
            </div>
        </div>
    </div>
</nav>
